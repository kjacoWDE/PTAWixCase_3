<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINSS Clinical Reasoning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F7F4;--ink:#1C2A2F;--muted:#6E7B74;--line:#E2E6DF;--surface:#FFFFFF;
    --teal:#2F6F6A;--teal-soft:#E8F0EC;--teal-deep:#234F4B;--alert:#C2542E;--alert-soft:#F7E9E1;
    --amber:#B7791F;--amber-soft:#F6EEDD;
    --shadow:0 1px 2px rgba(28,42,47,.04), 0 8px 30px rgba(28,42,47,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;padding:clamp(16px,4vw,48px)}
  .wrap{max-width:1080px;margin:0 auto}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--teal);display:flex;align-items:center;gap:10px}
  .eyebrow .tick{width:22px;height:1px;background:var(--teal)}
  h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(28px,5vw,46px);line-height:1.05;
    letter-spacing:-.01em;margin:14px 0 0}
  .lede{color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:60ch;margin-top:16px}
  .btn{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:15px;border:none;border-radius:11px;
    padding:14px 24px;cursor:pointer;background:var(--teal);color:#fff;transition:transform .15s,background .2s;
    display:inline-flex;align-items:center;gap:10px}
  .btn:hover{background:var(--teal-deep)} .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#B7C2BD;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--teal-soft)}
  .btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .start-row{margin-top:28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .start-row .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}

  /* progress rail */
  .rail{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
  .rail .seg{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface)}
  .rail .seg.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rail .seg.done{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal-soft)}

  .stage{display:grid;grid-template-columns:1fr 340px;gap:26px;margin-top:24px;align-items:start}
  @media(max-width:860px){.stage{grid-template-columns:1fr}}
  .scene{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:clamp(20px,3.2vw,32px);box-shadow:var(--shadow)}
  .phase-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .phase-title{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(20px,3vw,27px);line-height:1.15;margin-top:8px}
  .phase-sub{color:var(--muted);font-size:14.5px;margin-top:10px;max-width:56ch}

  /* POC note */
  .note{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:22px}
  .note-head{background:var(--teal-deep);color:#EAF1EE;padding:14px 18px;font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .note-body{padding:20px 22px}
  .note-dx{font-family:"Fraunces",serif;font-size:20px;font-weight:500;margin-bottom:14px}
  .note-row{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
  .note-row:first-of-type{border-top:none}
  .note-row .lab{flex:0 0 132px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding-top:2px}
  .note-row .val{flex:1}
  .note-row .val ul{margin:0;padding-left:18px} .note-row .val li{margin:2px 0}

  /* interview */
  .qgrid{display:grid;gap:10px;margin-top:20px}
  .qbtn{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
    font-size:14.5px;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .16s,background .16s;
    display:flex;justify-content:space-between;gap:12px;align-items:center}
  .qbtn:hover{border-color:var(--teal);background:#fff}
  .qbtn:disabled{opacity:.5;cursor:default;background:var(--surface)}
  .qbtn .dim{display:none; font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--teal);flex:0 0 auto}

  /* SINSS segmented */
  .sinss-q{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
  .sinss-q:first-child{border-top:none;padding-top:0;margin-top:12px}
  .sinss-q .letter{font-family:"Fraunces",serif;font-weight:600;font-size:15px;color:var(--teal-deep);
    background:var(--teal-soft);width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;margin-right:9px}
  .sinss-q .qh{display:flex;align-items:center;font-size:16px;font-weight:600}
  .sinss-q .qp{font-size:13.5px;color:var(--muted);margin:8px 0 12px 35px}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-left:35px}
  .opt{font-family:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 14px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--teal)}
  .opt.picked{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-deep);font-weight:600}
  .opt.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-deep);font-weight:600}
  .opt.wrong{border-color:#EAC9B8;background:var(--alert-soft);color:var(--alert)}
  .opt:disabled{cursor:default}
  .why{margin:12px 0 0 35px;font-size:13.5px;line-height:1.5;border-radius:9px;padding:11px 14px}
  .why.good{background:var(--teal-soft);color:var(--teal-deep)}
  .why.bad{background:var(--alert-soft);color:#7a3418}
  .why .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px;opacity:.8}

  /* interventions */
  .ivlist{display:grid;gap:10px;margin-top:20px}
  .iv{display:flex;gap:13px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);
    border-radius:11px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
  .iv:hover{border-color:var(--teal)}
  .iv.sel{border-color:var(--teal);background:var(--teal-soft)}
  .iv .box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);margin-top:1px;
    display:grid;place-items:center;font-size:13px;color:#fff}
  .iv.sel .box{background:var(--teal);border-color:var(--teal)}
  .iv .txt{font-size:14.5px;line-height:1.45}
  .iv.graded{cursor:default}
  .iv.ok{border-color:var(--teal);background:var(--teal-soft)}
  .iv.err{border-color:#EAC9B8;background:var(--alert-soft)}
  .iv .verdict{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    margin-top:7px;display:block}
  .iv .fb{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.45}

  /* side chart */
  .chart{position:sticky;top:24px;display:grid;gap:16px}
  @media(max-width:860px){.chart{position:static}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;box-shadow:var(--shadow)}
  .panel h3{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .pt-id{display:flex;gap:14px;align-items:center}
  .pt-avatar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);
    display:grid;place-items:center;font-family:"Fraunces",serif;font-size:19px;font-weight:600}
  .pt-name{font-family:"Fraunces",serif;font-size:19px;font-weight:500;line-height:1.1}
  .pt-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .findings{list-style:none;display:grid;gap:9px;min-height:8px}
  .findings li{font-size:13px;line-height:1.4;display:flex;gap:9px;align-items:flex-start;animation:rise .4s ease both}
  .findings li .fd{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--teal);background:var(--teal-soft);border-radius:4px;padding:2px 6px;margin-top:1px}
  .empty-note{font-size:13px;color:var(--muted);font-style:italic}
  .sinss-read{display:grid;gap:8px}
  .sinss-read .r{display:flex;justify-content:space-between;align-items:center;font-size:13px;
    padding:7px 0;border-bottom:1px solid var(--line)}
  .sinss-read .r:last-child{border-bottom:none}
  .sinss-read .r .rk{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .sinss-read .r .rv{font-weight:600;color:var(--teal-deep)}
  .sinss-read .r .rv.blank{color:#C0C8C3;font-weight:400;font-style:italic}

  /* debrief */
  .verdict{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,36px);box-shadow:var(--shadow)}
  .verdict h2{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(23px,4vw,32px);line-height:1.12;margin-top:6px}
  .score-strip{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
  .score-item .n{font-family:"Fraunces",serif;font-size:30px;font-weight:500;line-height:1}
  .score-item .l{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .expert{background:var(--teal-deep);color:#EAF1EE;border-radius:18px;padding:clamp(22px,4vw,32px);margin-top:22px}
  .expert h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9DC3BC;margin-bottom:14px}
  .expert p{font-size:15px;line-height:1.62;max-width:64ch} .expert p+p{margin-top:12px}
  .expert em{font-style:italic;border-bottom:1px solid #4C736E}

  .footer{margin-top:34px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;color:var(--muted)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <section id="intro">
    <div class="eyebrow"><span class="tick"></span><span id="i-kicker"></span></div>
    <h1 id="i-title"></h1>
    <p class="lede" id="i-lede"></p>
    <div class="start-row">
      <button class="btn" id="i-start" onclick="startCase()">Open the chart →</button>
      <span class="meta" id="i-meta"></span>
    </div>
  </section>

  <section id="sim" class="hidden">
    <div class="eyebrow"><span class="tick"></span><span id="s-kicker"></span></div>
    <div class="rail" id="rail"></div>
    <div class="stage">
      <div class="scene" id="scene"></div>
      <aside class="chart">
        <div class="panel">
          <h3>Patient</h3>
          <div class="pt-id">
            <div class="pt-avatar" id="pt-avatar"></div>
            <div><div class="pt-name" id="pt-name"></div><div class="pt-sub" id="pt-sub"></div></div>
          </div>
        </div>
        <div class="panel">
          <h3>Subjective findings</h3>
          <ul class="findings" id="findings"></ul>
          <div id="findings-empty" class="empty-note">Interview the patient to gather findings.</div>
        </div>
        <div class="panel">
          <h3>SINSS readout</h3>
          <div class="sinss-read" id="sinss-read"></div>
        </div>
      </aside>
    </div>
  </section>

  <section id="debrief" class="hidden">
    <div class="eyebrow"><span class="tick"></span>Session Debrief</div>
    <div class="verdict" style="margin-top:18px">
      <h2 id="d-title"></h2>
      <div class="score-strip">
        <div class="score-item"><div id="d-sinss" class="n"></div><div class="l">SINSS correct</div></div>
        <div class="score-item"><div id="d-iv" class="n"></div><div class="l">Interventions correct</div></div>
        <div class="score-item"><div id="d-flag" class="n"></div><div class="l">Change reported</div></div>
      </div>
    </div>
    <div class="expert">
      <h3 id="e-head"></h3>
      <div id="e-body"></div>
    </div>
    <div class="start-row" style="justify-content:center">
      <button class="btn" onclick="startCase()">Run it again →</button>
      <button class="btn ghost" onclick="toIntro()">Back to start</button>
    </div>
  </section>

  <div class="footer" id="foot"></div>
</div>

<script>
/* =====================================================================
   ▼▼▼  CASE START — replace this object to build a new SINSS case.
        Ortho scenarios only (no neuro) for this student group.
   ===================================================================== */
const SINSS_CASE = {
  meta: {
    number: "S3",
    kicker: "PTA Clinical Reasoning · SINSS",
    title: "Left Shoulder That Can’t Keep Up Overhead",
    lede: "You are the PTA carrying out an established plan of care. Review the chart, interview the patient, classify today’s status using SINSS, then select only the interventions that fit this visit.",
    duration: "~8 minutes · interview · classify · treat",
    patient: { initials: "MR", name: "Melissa Robles", subtitle: "49 · dental hygienist" }
  },

  poc: {
    label: "Plan of Care · initial eval 3 months into onset",
    dx: "Left rotator cuff tendinopathy (supraspinatus)",
    fields: [
      { lab: "Mechanism", val: "Gradual onset from repetitive overhead work as a dental hygienist; symptoms present for 3 months." },
      { lab: "Subjective", val: "Pain 3/10 baseline and up to 7/10 with overhead activity; difficulty with overhead reach and lifting groceries; goal is pain-free work duties including reaching and stooping." }
    ],
    objective: [
      "ROM: shoulder flexion L 145° with painful arc, R 160°",
      "MMT: supraspinatus L 4−/5, R 5/5",
      "Special tests: Hawkins-Kennedy, Neer, and Empty Can positive on L",
      "Movement: scapular dyskinesis with excessive scapular elevation during abduction",
      "Palpation: supraspinatus tendon tenderness",
      "Muscle length: pec minor limited",
      "Accessory motion: GH posterior glide hypomobile L, normal R"
    ],
    stg: [
      "Full, pain-free shoulder flexion and abduction as needed for return to work — 2 wks",
      "Improve scapular control as needed for work as dental hygienist — 2 wks",
      "ER strength B 5/5 as needed for reaching tasks — 2 wks"
    ],
    ltg: [
      "Pain-free overhead reach — 6 wks",
      "Full work duties — 6 wks",
      "Supraspinatus strength 5/5 — 6 wks"
    ],
    plan: [
      "Therapeutic Exercise to strengthen rotator cuff and scapular stabilizers",
      "Manual Therapy to improve GH joint mobility and reduce soft tissue tension",
      "Therapeutic Activity to retrain functional overhead reaching",
      "Neuromuscular Reeducation to improve scapular motor control",
      "Ultrasound to reduce tendon irritability"
    ]
  },

  interview: [
    { dim:"Severity", q:"How would you rate your pain at rest and when you reach overhead at work?", a:"“At rest it sits around a 3. Reaching overhead at work can spike it to about a 7.”" },
    { dim:"Irritability", q:"When it flares with overhead tasks, how quickly is it provoked and how long does it take to settle?", a:"“It comes on pretty quickly once I’m working overhead, and it can stay irritated for a while after my shift.”" },
    { dim:"Nature", q:"How would you describe the pain? Any numbness, tingling, or symptoms below the elbow?", a:"“It’s an ache at the top and side of my left shoulder. No tingling or numbness down the arm.”" },
    { dim:"Stability", q:"Over the last few weeks, is your shoulder improving, staying the same, or worsening?", a:"“It’s been pretty much the same overall — still bothers me with overhead work.”" },
    { dim:"Stage", q:"How long has this been going on now?", a:"“About three months.”" },
    { dim:"Function", q:"Which daily activities are most limited right now?", a:"“Reaching overhead and lifting groceries are the biggest problems.”" },
    { dim:"Movement", q:"Do you notice shoulder hiking or compensation when you raise your arm?", a:"“Yes, I feel like I shrug my shoulder up to get my arm overhead.”" }
  ],

  sinss: [
    { letter:"S", key:"Severity", prompt:"How severe is her condition based on current pain behavior?",
      options:["Low","Moderate","High"], correct:"Moderate",
      why:"Baseline pain is 3/10, but overhead pain reaches 7/10. The presentation is not constantly severe, but pain intensity during key tasks is clearly meaningful, supporting a moderate severity classification." },
    { letter:"I", key:"Irritability", prompt:"How irritable is the shoulder today?",
      options:["Low","Moderate","High"], correct:"Moderate",
      why:"Symptoms are provoked reliably with overhead demands and do not settle immediately, but they are tied to load-specific activity rather than minimal movement at rest. This best fits moderate irritability." },
    { letter:"N", key:"Nature", prompt:"What is the dominant pain mechanism?",
      options:["Nociceptive","Neuropathic","Nociplastic"], correct:"Nociceptive",
      why:"Local shoulder pain linked to mechanical loading, tendon tenderness, painful arc, and positive impingement/rotator cuff tests support a nociceptive tendon-related presentation without neuro features." },
    { letter:"S", key:"Stability", prompt:"How is the condition progressing?",
      options:["Improving","Same","Worsening"], correct:"Same",
      why:"She reports persistent, similar provocation with work tasks over recent weeks rather than clear trend up or down, so current stability is best classified as unchanged." },
    { letter:"S", key:"Stage", prompt:"What stage is this condition?",
      options:["Acute (1–14 days)","Subacute (2–6 wks)","Chronic (> 6 wks)"], correct:"Chronic (> 6 wks)",
      why:"Symptoms have been present for 3 months, placing this case well beyond 6 weeks in the chronic stage." }
  ],

  interventions: {
    prompt: "Given her status today — moderate severity/irritability, chronic stage, and unchanged function with overhead work — select the interventions that are appropriate for this visit.",
    items: [
      { label:"Progressive rotator cuff loading (pain-monitored), including ER and scaption as tolerated", verdict:"perform",
        why:"This directly addresses supraspinatus and cuff capacity deficits and aligns with chronic tendinopathy management when symptoms are monitored." },
      { label:"Scapular stabilization and neuromuscular re-education to reduce excessive elevation during abduction", verdict:"perform",
        why:"Targeting scapular motor control addresses the observed dyskinesis and can improve movement efficiency during overhead tasks." },
      { label:"Manual therapy: GH posterior glide mobilization and soft tissue work for pec minor/supraspinatus region", verdict:"perform",
        why:"This matches exam findings of posterior glide hypomobility and soft tissue restriction/tenderness, and can support improved mechanics." },
      { label:"Functional overhead reaching retraining with graded exposure", verdict:"perform",
        why:"Task-specific progression is needed for return to pain-free work duties involving repetitive reaching." },
      { label:"Ultrasound as adjunct for tendon irritability while active program continues", verdict:"perform",
        why:"It is included in the established plan and may help calm symptoms enough to maintain active loading and motor retraining." },
      { label:"Heavy overhead loading to fatigue despite pain reproduction", verdict:"hold",
        why:"Overloading into significant pain can worsen tendon irritability and movement compensation; load should be graded and symptom-guided." },
      { label:"Complete rest from all shoulder movement for 2 weeks", verdict:"hold",
        why:"Full immobilization is not indicated here and would likely reduce capacity; controlled, progressive loading is preferred." },
      { label:"Document status and communicate lack of progress to supervising PT for possible plan progression/modification", verdict:"report",
        why:"An unchanged 3-month presentation with ongoing occupational limits is clinically important and should be communicated for coordinated plan updates." }
    ]
  },

  expert: {
    heading: "How the reasoning fits together",
    paragraphs: [
      "This case is chronic and load-sensitive, not acutely inflammatory from a single recent trauma. That means your session should emphasize <em>graded capacity building</em>, not either complete unloading or aggressive painful overload.",
      "SINSS helps dose the visit: moderate severity/irritability supports active strengthening, motor control, and functional retraining with symptom monitoring. Pair this with targeted manual therapy for measured impairments, and communicate unchanged status so the supervising PT can refine progression if needed."
    ]
  }
};
/* =====================================================================
   ▲▲▲  CASE END — engine below; leave it alone.
   ===================================================================== */

const PHASES = ["Plan of care","Interview","Classify (SINSS)","Interventions"];
const $ = id => document.getElementById(id);
let state;

function boot(){
  const m = SINSS_CASE.meta;
  document.title = m.title;
  const tag = `${m.kicker} · ${m.number}`;
  $("i-kicker").textContent = tag; $("s-kicker").textContent = tag;
  $("i-title").textContent = m.title;
  $("i-lede").textContent = m.lede;
  $("i-meta").textContent = m.duration || "";
  $("foot").textContent = "A reusable clinical-reasoning engine · Swarf ATX";
  $("pt-avatar").textContent = m.patient.initials;
  $("pt-name").textContent = m.patient.name;
  $("pt-sub").textContent = m.patient.subtitle;
}

function toIntro(){ show("intro"); scrollTop(); }
function show(w){ ["intro","sim","debrief"].forEach(s => $(s).classList.toggle("hidden", s!==w)); }
function scrollTop(){ window.scrollTo({top:0,behavior:"instant"}); }

function startCase(){
  state = { phase:0, asked:[], findings:[], sinssPicks:{}, ivPicks:new Set() };
  show("sim");
  renderRail(); renderFindings(); renderSinssRead();
  renderPhase();
  scrollTop();
}

function renderRail(){
  $("rail").innerHTML = "";
  PHASES.forEach((p,i) => {
    const d = document.createElement("span");
    d.className = "seg" + (i===state.phase?" on":i<state.phase?" done":"");
    d.textContent = (i+1) + " · " + p;
    $("rail").appendChild(d);
  });
}

function renderPhase(){
  renderRail();
  const s = $("scene");
  if(state.phase===0) return renderPOC(s);
  if(state.phase===1) return renderInterview(s);
  if(state.phase===2) return renderSinss(s);
  if(state.phase===3) return renderInterventions(s);
}

function renderPOC(s){
  const p = SINSS_CASE.poc;
  const obj = p.objective.map(o=>`<li>${o}</li>`).join("");
  const plan = p.plan.map(o=>`<li>${o}</li>`).join("");
  s.innerHTML = `
    <div class="phase-tag">Phase 1 · Plan of care</div>
    <div class="phase-title">Read the chart before you touch the patient</div>
    <p class="phase-sub">This plan was written by the evaluating PT. Your job today is to carry it out — but only as far as the patient's current status allows.</p>
    <div class="note">
      <div class="note-head"><span>${p.label}</span><span>Ortho</span></div>
      <div class="note-body">
        <div class="note-dx">${p.dx}</div>
        ${p.fields.map(f=>`<div class="note-row"><div class="lab">${f.lab}</div><div class="val">${f.val}</div></div>`).join("")}
        <div class="note-row"><div class="lab">Objective</div><div class="val"><ul>${obj}</ul></div></div>
        <div class="note-row"><div class="lab">Short-term goals</div><div class="val">${p.stg.join("<br>")}</div></div>
        <div class="note-row"><div class="lab">Long-term goals</div><div class="val">${p.ltg.join("<br>")}</div></div>
        <div class="note-row"><div class="lab">Treatment plan</div><div class="val"><ul>${plan}</ul></div></div>
      </div>
    </div>
    <div class="start-row"><button class="btn" onclick="next()">Interview the patient →</button></div>`;
}

function renderInterview(s){
  s.innerHTML = `
    <div class="phase-tag">Phase 2 · Interview</div>
    <div class="phase-title">Ask what you need to place her status</div>
    <p class="phase-sub">Each question maps to part of the SINSS picture. Ask enough to classify all five — answers collect in the findings panel.</p>
    <div class="qgrid" id="qgrid"></div>
    <div class="start-row"><button class="btn" id="toClass" onclick="next()" ${state.asked.length? "":"disabled"}>Classify her status →</button></div>`;
  const g = $("qgrid");
  SINSS_CASE.interview.forEach((item,i) => {
    const b = document.createElement("button");
    b.className = "qbtn";
    const asked = state.asked.includes(i);
    b.disabled = asked;
    b.innerHTML = `<span>${item.q}</span><span class="dim">${item.dim}</span>`;
    b.onclick = () => {
      state.asked.push(i);
      addFinding(item.dim, item.a);
      b.disabled = true;
      $("toClass").disabled = false;
    };
    g.appendChild(b);
  });
}

function addFinding(dim, text){
  state.findings.push({dim, text});
  renderFindings();
}
function renderFindings(){
  const ul = $("findings");
  ul.innerHTML = "";
  if(state.findings.length) $("findings-empty").classList.add("hidden");
  else $("findings-empty").classList.remove("hidden");
  state.findings.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="fd">${f.dim}</span><span>${f.text}</span>`;
    ul.appendChild(li);
  });
}

function renderSinssRead(){
  const box = $("sinss-read");
  box.innerHTML = "";
  SINSS_CASE.sinss.forEach(d => {
    const picked = state.sinssPicks[d.key];
    const r = document.createElement("div");
    r.className = "r";
    r.innerHTML = `<span class="rk">${d.key}</span><span class="rv ${picked?'':'blank'}">${picked||'—'}</span>`;
    box.appendChild(r);
  });
}

function renderSinss(s){
  s.innerHTML = `
    <div class="phase-tag">Phase 3 · Classify</div>
    <div class="phase-title">Set her SINSS values</div>
    <p class="phase-sub">Use the findings on the right. Pick once per row — you'll see whether it holds up and why.</p>
    <div id="sinssq"></div>
    <div class="start-row"><button class="btn" id="toIv" onclick="next()" disabled>Choose interventions →</button></div>`;
  const box = $("sinssq");
  SINSS_CASE.sinss.forEach((d,idx) => {
    const wrap = document.createElement("div");
    wrap.className = "sinss-q";
    wrap.innerHTML = `<div class="qh"><span class="letter">${d.letter}</span>${d.key}</div>
      <div class="qp">${d.prompt}</div>
      <div class="opts" id="opts-${idx}"></div>
      <div class="why hidden" id="why-${idx}"></div>`;
    box.appendChild(wrap);
    d.options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = opt;
      b.onclick = () => pickSinss(idx, opt, b);
      $(`opts-${idx}`).appendChild(b);
    });
  });
}

function pickSinss(idx, opt, btn){
  const d = SINSS_CASE.sinss[idx];
  if(state.sinssPicks[d.key]) return; // lock first answer
  state.sinssPicks[d.key] = opt;
  const correct = opt === d.correct;
  const opts = $(`opts-${idx}`).children;
  for(const b of opts){
    b.disabled = true;
    if(b.textContent === d.correct) b.classList.add("right");
    else if(b.textContent === opt) b.classList.add("wrong");
  }
  const w = $(`why-${idx}`);
  w.classList.remove("hidden");
  w.classList.add(correct?"good":"bad");
  w.innerHTML = `<span class="k">${correct?"Holds up":"Reconsider — correct: "+d.correct}</span>${d.why}`;
  renderSinssRead();
  if(Object.keys(state.sinssPicks).length === SINSS_CASE.sinss.length) $("toIv").disabled = false;
}

function renderInterventions(s){
  const iv = SINSS_CASE.interventions;
  s.innerHTML = `
    <div class="phase-tag">Phase 4 · Interventions</div>
    <div class="phase-title">Build today's session</div>
    <p class="phase-sub">${iv.prompt}</p>
    <div class="ivlist" id="ivlist"></div>
    <div class="start-row"><button class="btn" id="scoreBtn" onclick="scorePlan()">Score my plan →</button></div>`;
  const list = $("ivlist");
  iv.items.forEach((it,i) => {
    const row = document.createElement("div");
    row.className = "iv" + (state.ivPicks.has(i)?" sel":"");
    row.innerHTML = `<div class="box">${state.ivPicks.has(i)?"✓":""}</div><div class="txt">${it.label}</div>`;
    row.onclick = () => {
      if(row.classList.contains("graded")) return;
      if(state.ivPicks.has(i)){ state.ivPicks.delete(i); row.classList.remove("sel"); row.querySelector(".box").textContent=""; }
      else { state.ivPicks.add(i); row.classList.add("sel"); row.querySelector(".box").textContent="✓"; }
    };
    list.appendChild(row);
  });
}

function scorePlan(){
  const iv = SINSS_CASE.interventions;
  const rows = $("ivlist").children;
  iv.items.forEach((it,i) => {
    const shouldPick = it.verdict==="perform" || it.verdict==="report";
    const picked = state.ivPicks.has(i);
    const right = shouldPick === picked;
    const row = rows[i];
    row.classList.add("graded", right?"ok":"err");
    const vlabel = it.verdict==="perform" ? "Appropriate today"
      : it.verdict==="report" ? "Report before progressing"
      : "Hold for today";
    const tag = document.createElement("span");
    tag.className = "verdict";
    tag.style.color = right ? "var(--teal-deep)" : "var(--alert)";
    tag.textContent = (picked?"You selected · ":"You held · ") + vlabel;
    const fb = document.createElement("div");
    fb.className = "fb"; fb.textContent = it.why;
    row.appendChild(tag); row.appendChild(fb);
    row.onclick = null;
  });
  $("scoreBtn").textContent = "See debrief →";
  $("scoreBtn").onclick = toDebrief;
}

function next(){ state.phase++; renderPhase(); document.querySelector('.scene').scrollIntoView({behavior:'smooth',block:'start'}); }

function toDebrief(){
  const sinssCorrect = SINSS_CASE.sinss.filter(d => state.sinssPicks[d.key]===d.correct).length;
  const iv = SINSS_CASE.interventions;
  let ivCorrect = 0, reportItem = -1;
  iv.items.forEach((it,i) => {
    const shouldPick = it.verdict==="perform"||it.verdict==="report";
    if(shouldPick === state.ivPicks.has(i)) ivCorrect++;
    if(it.verdict==="report") reportItem = i;
  });
  const reported = reportItem>=0 && state.ivPicks.has(reportItem);
  $("d-sinss").textContent = sinssCorrect + "/" + SINSS_CASE.sinss.length;
  $("d-iv").textContent = ivCorrect + "/" + iv.items.length;
  $("d-flag").textContent = reported ? "Yes" : "No";
  const allSinss = sinssCorrect===SINSS_CASE.sinss.length;
  $("d-title").textContent = (allSinss && ivCorrect===iv.items.length)
    ? "You matched the treatment to the patient."
    : (reported ? "Solid reasoning — a few calls to revisit." : "Good start — mind the status before you progress.");
  $("e-head").textContent = SINSS_CASE.expert.heading;
  const body = $("e-body"); body.innerHTML = "";
  SINSS_CASE.expert.paragraphs.forEach(t => { const p=document.createElement("p"); p.innerHTML=t; body.appendChild(p); });
  show("debrief"); scrollTop();
}

boot();
</script>
</body>
  <!-- trigger branch pages deploy -->
</html>
